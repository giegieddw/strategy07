name: Strategy07

on:
  schedule:
    - cron: '25 1 * * 1-5'   # 早盘 9:25
    - cron: '10 7 * * 1-5'   # 收盘 15:10
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 收盘扫描+推送 (15:10)
        if: github.event.schedule == '10 7 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          echo "=== 收盘扫描 ==="
          python scripts/daily_feishu.py
          echo "=== 保存状态 ==="
          git config user.name "Bot"
          git config user.email "bot@auto"
          git add data/ output/
          git diff --staged --quiet || (git commit -m "$(date +%Y-%m-%d)" && git push)

      - name: 早盘检查 (9:25)
        if: github.event.schedule == '25 1 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          echo "=== 早盘检查 ==="
          python scripts/morning_risk_check.py
